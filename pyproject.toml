[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-signal-quantumtrace"
version = "0.3.3"
description = "Evidence-based cryptographic inventory and quantum readiness assessment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
certificates = ["cryptography>=42"]

[project.scripts]
quantumtrace = "quantumtrace.cli:main"

[tool.setuptools.packages.find]
include = ["quantumtrace*"]

[tool.setuptools.package-data]
quantumtrace = ["web/*.html", "web/*.css", "web/*.js"]
